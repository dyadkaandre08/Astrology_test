<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA — Персональная космология</title>

    <!-- SF Pro Fallback / Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ================= APPLE DESIGN SYSTEM ================= */
      :root {
        --bg-black: #000000;
        --bg-surface: #0c0c0e;
        --bg-card: rgba(255, 255, 255, 0.03);
        --bg-card-hover: rgba(255, 255, 255, 0.05);

        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-highlight: rgba(255, 255, 255, 0.18);

        --text-primary: #f5f5f7;
        --text-secondary: #86868b;
        --text-tertiary: #515154;
        --accent-starlight: #f2e9dc;

        --font-stack:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          "Inter", "Helvetica Neue", sans-serif;
        --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
        --radius-card: 24px;
        --radius-pill: 9999px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family: var(--font-stack);
        background-color: var(--bg-black);
        color: var(--text-primary);
        line-height: 1.47;
        letter-spacing: -0.015em;
        overflow-x: hidden;
        selection-background-color: #333;
      }

      ::selection {
        background: #ffffff;
        color: #000000;
      }

      a {
        color: inherit;
        text-decoration: none;
        transition: color 0.3s var(--ease-apple);
      }

      .container {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* ================= NAVIGATION ================= */
      header {
        position: fixed;
        top: 0;
        width: 100%;
        height: 52px;
        background: rgba(0, 0, 0, 0.72);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        z-index: 1000;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
      }

      .nav-container {
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .logo svg {
        width: 14px;
        height: 14px;
        fill: var(--text-primary);
      }

      .nav-links {
        display: flex;
        gap: 32px;
        font-size: 0.85rem;
        color: var(--text-secondary);
      }

      .nav-links a:hover {
        color: var(--text-primary);
      }

      /* ================= BUTTONS ================= */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 9px 18px;
        border-radius: var(--radius-pill);
        font-size: 0.85rem;
        font-weight: 400;
        transition: all 0.3s var(--ease-apple);
        cursor: pointer;
        border: none;
        outline: none;
      }

      .btn-primary {
        background: var(--text-primary);
        color: #000;
      }

      .btn-primary:hover {
        background: #ffffff;
        transform: scale(1.02);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-primary);
        backdrop-filter: blur(10px);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      /* ================= HERO ================= */
      .hero {
        padding-top: 170px;
        padding-bottom: 120px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .eyebrow {
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin-bottom: 16px;
      }

      .hero h1 {
        font-size: clamp(3rem, 7vw, 4.8rem);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1.05;
        max-width: 820px;
        margin: 0 auto 24px;
        background: linear-gradient(
          180deg,
          #ffffff 40%,
          rgba(255, 255, 255, 0.6) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .hero p {
        font-size: clamp(1.1rem, 2vw, 1.35rem);
        color: var(--text-secondary);
        max-width: 580px;
        margin: 0 auto 36px;
        font-weight: 400;
        line-height: 1.45;
      }

      .hero-actions {
        display: flex;
        gap: 16px;
        justify-content: center;
        margin-bottom: 80px;
      }

      /* Subtle Celestial Visual */
      .celestial-orbit-wrapper {
        position: relative;
        width: 320px;
        height: 320px;
        margin: 0 auto;
      }

      .orbit {
        position: absolute;
        top: 50%;
        left: 50%;
        border-radius: 50%;
        border: 1px solid var(--border-subtle);
        transform: translate(-50%, -50%);
      }

      .orbit-1 {
        width: 300px;
        height: 300px;
        animation: rotateSlow 80s linear infinite;
      }
      .orbit-2 {
        width: 220px;
        height: 220px;
        border-style: dashed;
        animation: rotateSlow 50s linear infinite reverse;
      }
      .orbit-3 {
        width: 140px;
        height: 140px;
      }

      .orbit-planet {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-primary);
        position: absolute;
        top: -3px;
        left: 50%;
        box-shadow: 0 0 12px 2px rgba(255, 255, 255, 0.7);
      }

      .celestial-core {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 12px;
        height: 12px;
        background: #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 40px 15px rgba(255, 255, 255, 0.2);
      }

      @keyframes rotateSlow {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      .ambient-blur {
        position: absolute;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 500px;
        height: 500px;
        background: radial-gradient(
          circle,
          rgba(140, 140, 180, 0.08) 0%,
          rgba(0, 0, 0, 0) 70%
        );
        pointer-events: none;
        z-index: -1;
      }

      /* ================= BENTO GRID (SERVICES) ================= */
      .section-header {
        margin-bottom: 48px;
      }

      .section-header h2 {
        font-size: clamp(2rem, 4vw, 2.8rem);
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .bento-grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 20px;
      }

      .bento-card {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-card);
        padding: 36px 32px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
        transition: all 0.4s var(--ease-apple);
      }

      .bento-card:hover {
        background: var(--bg-card-hover);
        border-color: var(--border-highlight);
        transform: translateY(-2px);
      }

      .col-8 {
        grid-column: span 7;
        min-height: 280px;
      }
      .col-4 {
        grid-column: span 5;
        min-height: 280px;
      }

      .card-tag {
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-tertiary);
        margin-bottom: 12px;
      }

      .card-content h3 {
        font-size: 1.4rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        margin-bottom: 10px;
      }

      .card-content p {
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.5;
        max-width: 420px;
      }

      /* ================= INTERACTIVE ZODIAC ================= */
      .interactive-section {
        padding: 120px 0;
      }

      .interactive-panel {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-card);
        padding: 48px;
        text-align: center;
      }

      .zodiac-selector {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 32px 0;
      }

      .zodiac-pill {
        background: transparent;
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        padding: 8px 16px;
        border-radius: var(--radius-pill);
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.25s var(--ease-apple);
      }

      .zodiac-pill:hover {
        border-color: var(--text-secondary);
        color: var(--text-primary);
      }

      .zodiac-pill.active {
        background: var(--text-primary);
        border-color: var(--text-primary);
        color: #000;
        font-weight: 500;
      }

      .advice-display {
        min-height: 80px;
        max-width: 620px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.15rem;
        color: var(--accent-starlight);
        line-height: 1.5;
        transition: opacity 0.3s ease;
      }

      /* ================= ABOUT / EDITORIAL ================= */
      .about-section {
        padding: 80px 0 120px;
        border-top: 1px solid var(--border-subtle);
      }

      .about-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        align-items: center;
      }

      .about-text h2 {
        font-size: 2.2rem;
        letter-spacing: -0.03em;
        margin-bottom: 24px;
      }

      .about-text p {
        color: var(--text-secondary);
        font-size: 1.05rem;
        margin-bottom: 20px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
        margin-top: 40px;
        padding-top: 32px;
        border-top: 1px solid var(--border-subtle);
      }

      .metric-val {
        font-size: 2.2rem;
        font-weight: 500;
        letter-spacing: -0.03em;
      }

      .metric-label {
        font-size: 0.75rem;
        color: var(--text-secondary);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-top: 4px;
      }

      .about-image-card {
        border-radius: var(--radius-card);
        overflow: hidden;
        border: 1px solid var(--border-subtle);
        position: relative;
      }

      .about-image-card img {
        width: 100%;
        height: auto;
        display: block;
        filter: grayscale(80%) contrast(110%);
        transition: filter 0.6s var(--ease-apple);
      }

      .about-image-card:hover img {
        filter: grayscale(30%) contrast(105%);
      }

      /* ================= REVIEWS ================= */
      .reviews-section {
        padding: 80px 0;
      }

      .reviews-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .review-card {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-card);
        padding: 32px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .review-quote {
        color: var(--text-primary);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 24px;
      }

      .review-author {
        color: var(--text-secondary);
        font-size: 0.85rem;
        font-weight: 500;
      }

      /* ================= ACCORDION (FAQ) ================= */
      .faq-section {
        padding: 100px 0;
        border-top: 1px solid var(--border-subtle);
      }

      .faq-list {
        max-width: 760px;
        margin: 0 auto;
      }

      .faq-row {
        border-bottom: 1px solid var(--border-subtle);
      }

      .faq-trigger {
        width: 100%;
        background: none;
        border: none;
        color: var(--text-primary);
        font-size: 1.1rem;
        font-weight: 400;
        padding: 24px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-align: left;
        cursor: pointer;
        letter-spacing: -0.01em;
      }

      .faq-trigger svg {
        width: 14px;
        height: 14px;
        stroke: var(--text-secondary);
        transition: transform 0.3s var(--ease-apple);
      }

      .faq-row.active .faq-trigger svg {
        transform: rotate(45deg);
      }

      .faq-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s var(--ease-apple);
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .faq-content-inner {
        padding-bottom: 24px;
      }

      /* ================= FOOTER ================= */
      footer {
        padding: 60px 0 40px;
        border-top: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        font-size: 0.8rem;
      }

      .footer-cols {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 40px;
        margin-bottom: 48px;
      }

      .footer-cols p {
        max-width: 320px;
        line-height: 1.5;
        margin-top: 8px;
      }

      .footer-links-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .footer-links-group span {
        color: var(--text-primary);
        font-weight: 500;
        margin-bottom: 4px;
      }

      .footer-bottom {
        display: flex;
        justify-content: space-between;
        padding-top: 24px;
        border-top: 1px solid var(--border-subtle);
        color: var(--text-tertiary);
      }

      /* ================= RESPONSIVE ================= */
      @media (max-width: 900px) {
        .bento-grid {
          grid-template-columns: 1fr;
        }
        .col-8,
        .col-4 {
          grid-column: span 1;
        }
        .about-grid {
          grid-template-columns: 1fr;
          gap: 40px;
        }
        .reviews-grid {
          grid-template-columns: 1fr;
        }
        .footer-cols {
          grid-template-columns: 1fr;
          gap: 30px;
        }
      }

      @media (max-width: 768px) {
        .nav-links {
          display: none;
        }
        .metrics {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .hero h1 {
          font-size: 2.8rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- NAVIGATION -->
    <header>
      <div class="nav-container">
        <a href="#" class="logo">
          <svg viewBox="0 0 24 24">
            <circle
              cx="12"
              cy="12"
              r="10"
              stroke="white"
              stroke-width="2"
              fill="none"
            />
          </svg>
          Aura
        </a>
        <nav class="nav-links">
          <a href="#services">Разборы</a>
          <a href="#about">Метод</a>
          <a href="#interactive">Совет</a>
          <a href="#faq">Вопросы</a>
        </nav>
        <a href="#interactive" class="btn btn-primary">Консультация</a>
      </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
      <div class="ambient-blur"></div>
      <div class="container">
        <p class="eyebrow">Новая оптика вашей жизни</p>
        <h1>Ясность, заложенная в траекториях звёзд.</h1>
        <p>
          Глубокий анализ натальной карты, транзитов и синастрии. Точный перевод
          языка планетарных циклов в практические решения.
        </p>

        <div class="hero-actions">
          <a href="#interactive" class="btn btn-primary"
            >Попробовать бесплатно</a
          >
          <a href="#services" class="btn btn-secondary">Подробнее о методике</a>
        </div>

        <!-- Apple-style refined planetary orbits -->
        <div class="celestial-orbit-wrapper">
          <div class="orbit orbit-1">
            <div class="orbit-planet"></div>
          </div>
          <div class="orbit orbit-2"></div>
          <div class="orbit orbit-3">
            <div class="orbit-planet" style="top: 100%"></div>
          </div>
          <div class="celestial-core"></div>
        </div>
      </div>
    </section>

    <!-- BENTO GRID (SERVICES) -->
  </body>
</html>
